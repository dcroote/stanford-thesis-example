name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 15 * *'

permissions:
  contents: read

jobs:
  compile_latex_and_upload_artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - shell: bash
        run: |
          mv main.pdf thesis-example.pdf
        # rename is for backwards compatibility

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          path: thesis-example.pdf
          name: thesis-example

  download_artifact_and_upload_release_asset:
    needs: compile_latex_and_upload_artifact # compilation must have completed successfully
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') # tags follow semantic versioning i.e. v0.2.1
    permissions:
      actions: read
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name thesis-example --dir "$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/thesis-example.pdf" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --notes "" \
            --verify-tag
