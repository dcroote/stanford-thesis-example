name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 15 * *'

jobs:
  compile_latex_and_upload_artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex

      - shell: bash
        run: |
          mv main.pdf thesis-example.pdf
        # rename is for backwards compatibility

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          path: thesis-example.pdf
          name: thesis-example

  download_artifact_and_upload_release_asset:
    needs: compile_latex_and_upload_artifact # compilation must have completed successfully
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # tags follow semantic versioning i.e. v0.2.1
    permissions:
      actions: read # download the PDF artifact from this workflow run
      contents: write # create the draft release and upload the PDF
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: thesis-example # same name as uploaded artifact

      # actions/create-release and actions/upload-release-asset are archived
      # and declare runs.using: node12. Runners removed Node 20 on 2026-09-23,
      # so those actions can no longer run. gh is preinstalled on ubuntu-latest.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./thesis-example.pdf \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --notes "" \
            --verify-tag
